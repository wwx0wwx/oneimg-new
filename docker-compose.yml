services:
  oneimg:
    image: oneimg:latest
    container_name: oneimg
    restart: unless-stopped
    ports:
      # 容器内监听端口（PORT）与映射保持一致：8888
      - "8888:8888"
    volumes:
      - ./db:/app/db
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8888
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/api/settings/public"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
